[package]
name = "snowy-display"
version = "0.1.0"
description = "Realistic snow on your windows"
authors = ["Snowy Display contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "snowy_display_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13" }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2"
